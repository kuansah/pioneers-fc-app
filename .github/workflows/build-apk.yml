name: Build Pioneer's FC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Check Java
        run: |
          java -version
          javac -version

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel
          python -m pip install --upgrade cython
          python -m pip install --upgrade buildozer

      - name: Check Buildozer
        run: |
          buildozer --version

      - name: Show project files
        run: |
          echo "Project files:"
          find . -maxdepth 2 -type f | sort

      - name: Build Android APK
        run: |
          buildozer android debug

      - name: Find APK
        run: |
          echo "APK files found:"
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pioneers-fc-apk
          path: bin/*.apk
          if-no-files-found: error