name: Build Pioneer's FC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            ant \
            autoconf \
            automake \
            autopoint \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            build-essential \
            python3-dev \
            python3-venv \
            ccache

      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython<3.4"
          python -m pip install buildozer

      - name: Show versions
        run: |
          echo "===== Python ====="
          python --version

          echo "===== Pip ====="
          pip --version

          echo "===== Buildozer ====="
          buildozer --version

          echo "===== Cython ====="
          cython --version

          echo "===== Java ====="
          java -version

          echo "===== Javac ====="
          javac -version

          echo "===== Java Home ====="
          echo "$JAVA_HOME"

      - name: Clean previous Android build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          buildozer -v android debug 2>&1 | tee build.log

      - name: List APK files
        if: always()
        run: |
          echo "===== APK files ====="
          find . -type f -name "*.apk" -print

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pioneers-fc-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pioneers-fc-apk
          path: bin/*.apk