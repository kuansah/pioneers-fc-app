name: Build Pioneer's FC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Set up Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

      - name: Set up Android SDK
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"

          cd "$HOME/android-sdk"

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip

          unzip -q commandlinetools-linux-13114758_latest.zip \
            -d "$HOME/android-sdk/cmdline-tools"

          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" \
             "$HOME/android-sdk/cmdline-tools/latest"

          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"

          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmdline-tools;latest"

      - name: Locate AIDL
        run: |
          echo "Searching for AIDL..."

          find "$ANDROID_HOME" -type f -name aidl -print

          AIDL_PATH=$(find "$ANDROID_HOME" -type f -name aidl | head -n 1)

          if [ -z "$AIDL_PATH" ]; then
            echo "ERROR: AIDL was not installed."
            exit 1
          fi

          AIDL_DIR=$(dirname "$AIDL_PATH")

          echo "$AIDL_DIR" >> "$GITHUB_PATH"

          echo "AIDL found at:"
          echo "$AIDL_PATH"

          "$AIDL_PATH" --version || true

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel
          python -m pip install --upgrade cython
          python -m pip install --upgrade buildozer

      - name: Check tools
        run: |
          java -version
          javac -version
          python --version
          buildozer --version
          adb version || true
          aidl --version || true

      - name: Show project files
        run: |
          echo "Project files:"
          find . -maxdepth 2 -type f | sort

      - name: Build APK
        run: |
          buildozer android debug

      - name: Find APK
        run: |
          echo "APK files:"
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pioneers-fc-apk
          path: bin/*.apk
          if-no-files-found: error