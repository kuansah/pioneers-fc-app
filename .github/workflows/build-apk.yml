name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show project files
        run: |
          echo "Current directory:"
          pwd
          echo ""
          echo "Project structure:"
          find . -maxdepth 3 -type f | sort | head -300

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project
        id: android
        shell: bash
        run: |
          echo "Searching for Gradle wrapper..."

          GRADLEW=$(find . -type f -name "gradlew" -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: No gradlew file was found."
            echo ""
            echo "This repository does not appear to contain a standard Gradle Android project."
            echo ""
            echo "Files found:"
            find . -maxdepth 4 -type f | sort | head -500
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Found Gradle wrapper:"
          echo "$GRADLEW"
          echo ""
          echo "Android project directory:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Make Gradle executable
        run: |
          chmod +x "${{ steps.android.outputs.project_dir }}/gradlew"

      - name: Build Debug APK
        working-directory: ${{ steps.android.outputs.project_dir }}
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Find generated APK
        run: |
          echo "Searching for generated APK..."
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pioneers-fc-apk
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error