name: Build Pioneer's FC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            ant \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            g++ \
            gcc \
            libffi-dev \
            libltdl-dev \
            libtool \
            libssl-dev \
            make \
            openjdk-17-jdk \
            patch \
            pkg-config \
            zlib1g-dev

      - name: Set Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel
          python -m pip install "Cython==0.29.33"
          python -m pip install --upgrade buildozer

      - name: Prepare Android SDK
        run: |
          mkdir -p "$HOME/.buildozer/android/platform/android-sdk/cmdline-tools"

          cd "$HOME/.buildozer/android/platform"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            -O cmdline-tools.zip

          unzip -q cmdline-tools.zip \
            -d android-sdk/cmdline-tools

          mv android-sdk/cmdline-tools/cmdline-tools \
             android-sdk/cmdline-tools/latest

      - name: Set Android environment
        run: |
          echo "ANDROIDSDK=$HOME/.buildozer/android/platform/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk" >> "$GITHUB_ENV"

          echo "$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/.buildozer/android/platform/android-sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify AIDL
        run: |
          echo "Buildozer SDK:"
          echo "$ANDROIDSDK"

          echo "Searching for AIDL:"
          find "$ANDROIDSDK" -type f -name aidl -print

          AIDL="$ANDROIDSDK/build-tools/35.0.0/aidl"

          if [ ! -f "$AIDL" ]; then
            echo "ERROR: AIDL is missing!"
            exit 1
          fi

          chmod +x "$AIDL"

          echo "AIDL found successfully:"
          ls -lh "$AIDL"

          echo "$(dirname "$AIDL")" >> "$GITHUB_PATH"

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;28.2.13676358"

      - name: Configure Android NDK
        run: |
          echo "ANDROIDNDK=$ANDROIDSDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROIDAPI=35" >> "$GITHUB_ENV"
          echo "NDKAPI=24" >> "$GITHUB_ENV"

      - name: Verify build tools
        run: |
          echo "Java:"
          java -version

          echo "Python:"
          python --version

          echo "Buildozer:"
          buildozer --version

          echo "AIDL:"
          which aidl

          echo "AIDL file:"
          ls -lh "$(which aidl)"

      - name: Show project files
        run: |
          echo "Project files:"
          find . -maxdepth 2 -type f | sort

      - name: Build APK
        run: |
          buildozer android debug

      - name: Find APK
        if: always()
        run: |
          echo "APK files:"
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pioneers-fc-apk
          path: bin/*.apk
          if-no-files-found: error