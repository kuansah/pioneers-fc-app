name: Build Pioneer's FC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            openjdk-17-jdk \
            python3-pip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Set Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK
        run: |
          mkdir -p "$HOME/.buildozer/android/platform"

          cd "$HOME/.buildozer/android/platform"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            -O cmdline-tools.zip

          mkdir -p cmdline-tools

          unzip -q cmdline-tools.zip -d cmdline-tools

          mv cmdline-tools/cmdline-tools cmdline-tools/latest

          echo "ANDROID_HOME=$HOME/.buildozer/android/platform" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform" >> "$GITHUB_ENV"

          echo "$HOME/.buildozer/android/platform/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/.buildozer/android/platform/platform-tools" >> "$GITHUB_PATH"
          echo "$HOME/.buildozer/android/platform/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify AIDL
        run: |
          echo "AIDL locations:"
          find "$ANDROID_HOME" -type f -name "aidl" -print

          AIDL=$(find "$ANDROID_HOME" -type f -name "aidl" | head -n 1)

          if [ -z "$AIDL" ]; then
            echo "AIDL was not found."
            exit 1
          fi

          echo "Found AIDL:"
          echo "$AIDL"

          echo "$(dirname "$AIDL")" >> "$GITHUB_PATH"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel
          python -m pip install --upgrade cython
          python -m pip install --upgrade buildozer

      - name: Verify build tools
        run: |
          java -version
          python --version
          buildozer --version
          aidl --version || true

      - name: Build APK
        run: |
          buildozer android debug

      - name: Find APK
        run: |
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pioneers-fc-apk
          path: bin/*.apk
          if-no-files-found: error